<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hall Recycling Helper</title>
  <style>
    :root {
      --ink: #14211a;
      --muted: #46564c;
      --page: #f4f7f5;
      --card: #ffffff;
      --line: #cfd9d2;
      --brand: #1d6b38;
      --brand-dark: #144d28;
      --ok-bg: #e7f5eb; --ok-line: #2f8a4c; --ok-ink: #145a2b;
      --nc-bg: #eef1f4; --nc-line: #6b7785; --nc-ink: #2f3a45;
      --bad-bg: #fdecec; --bad-line: #c0392b; --bad-ink: #8e1f14;
      --note-bg: #fff4cc; --note-line: #c99a06;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--page); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 1.25rem; line-height: 1.55;
    }
    .site-header { background: var(--brand); color: #fff; padding: 1.75rem 1rem; }
    .site-header .wrap, main { max-width: 760px; margin: 0 auto; }
    .site-header h1 { margin: 0; font-size: 2.4rem; line-height: 1.15; letter-spacing: -0.01em; }
    .site-header p { margin: 0.5rem 0 0; font-size: 1.2rem; color: #e3f2e8; }
    main { padding: 1.5rem 1rem 3rem; }

    .notice {
      margin: 0 0 1.5rem; padding: 0.75rem 1rem; font-size: 1.05rem;
      background: var(--note-bg); border-left: 6px solid var(--note-line); border-radius: 6px;
    }

    form {
      display: grid; grid-template-columns: 1fr auto; gap: 0.75rem 1rem; align-items: end;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem;
    }
    .field { display: flex; flex-direction: column; gap: 0.35rem; }
    .field-item { grid-column: 1 / -1; }
    label { font-weight: 700; font-size: 1.05rem; }
    input, select, button { font: inherit; border-radius: 8px; }
    input, select {
      width: 100%; padding: 0.7rem 0.85rem; color: var(--ink); background: #fff;
      border: 2px solid #9fb0a5;
    }
    input:focus, select:focus, button:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
    button {
      padding: 0.7rem 2rem; font-weight: 700; color: #fff; background: var(--brand);
      border: 2px solid var(--brand); cursor: pointer;
    }
    button:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
    button:disabled { cursor: wait; opacity: 0.7; }
    #loading-status { grid-column: 1 / -1; color: var(--muted); font-weight: 600; }
    #loading-status:not([hidden]) { display: inline-flex; align-items: center; gap: 0.6rem; }
    .spinner { width: 1.1em; height: 1.1em; border: 3px solid #c7d5cb; border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

    /* Result card. The JS sets its class to the API status (ok / not_covered / refused / error). */
    #result {
      display: none; margin-top: 1.75rem; padding: 1.25rem 1.5rem;
      background: var(--card); border: 2px solid var(--line); border-left-width: 10px; border-radius: 12px;
    }
    #result::before {
      display: inline-block; margin-bottom: 0.6rem; padding: 0.2rem 0.75rem; border-radius: 999px;
      font-size: 0.95rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    }
    #result.ok { border-color: var(--ok-line); }
    #result.ok::before { content: "Published rule"; background: var(--ok-bg); color: var(--ok-ink); }
    #result.not_covered { border-color: var(--nc-line); background: var(--nc-bg); }
    #result.not_covered::before { content: "Not covered"; background: #fff; color: var(--nc-ink); }
    #result.refused, #result.error { border-color: var(--bad-line); background: var(--bad-bg); }
    #result.refused::before { content: "Refused: possible hazard"; background: #fff; color: var(--bad-ink); }
    #result.error::before { content: "Error"; background: #fff; color: var(--bad-ink); }
    #result > p { margin: 0; font-size: 1.35rem; font-weight: 600; }
    #result dl {
      display: grid; grid-template-columns: max-content 1fr; gap: 0;
      margin: 1rem 0 0; border-top: 1px solid var(--line);
    }
    #result dt, #result dd { margin: 0; padding: 0.75rem 0; border-bottom: 1px solid var(--line); }
    #result dt { padding-right: 1.25rem; font-weight: 700; color: var(--muted); font-size: 1.05rem; }
    #result dd { overflow-wrap: anywhere; }
    /* The first row is the bin: make it the most prominent answer. */
    #result dd:first-of-type { font-size: 1.5rem; font-weight: 700; }
    #result a { color: #0b4f9c; font-size: 1.05rem; }

    @media (max-width: 560px) {
      body { font-size: 1.1rem; }
      .site-header h1 { font-size: 1.9rem; }
      form { grid-template-columns: 1fr; }
      #result dl { grid-template-columns: 1fr; }
      #result dt { padding-bottom: 0; border-bottom: 0; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>Hall Recycling Helper</h1>
      <p>Type an everyday item to see which bin it goes in, how to prepare it, and the official source.</p>
    </div>
  </header>

  <main>
    <p class="notice">Posted hall signage and instructions from hall staff always take priority over this tool.</p>

    <form id="ask-form">
      <div class="field field-item">
        <label for="item">Item</label>
        <input id="item" type="text" placeholder="e.g. plastic bottle" required>
      </div>
      <div class="field">
        <label for="context">Which bins?</label>
        <select id="context">
          <option value="hku_hall">HKU hall bin</option>
          <option value="epd_smart">EPD smart bin</option>
        </select>
      </div>
      <button id="ask-button" type="submit">Ask</button>
      <span id="loading-status" role="status" hidden><span class="spinner" aria-hidden="true"></span>Checking…</span>
    </form>

    <div id="result" aria-live="polite"></div>
  </main>

  <script>
    const form = document.getElementById("ask-form");
    const resultBox = document.getElementById("result");
    const askButton = document.getElementById("ask-button");
    const loadingStatus = document.getElementById("loading-status");

    function setLoading(loading) {
      askButton.disabled = loading;
      loadingStatus.hidden = !loading;
      form.setAttribute("aria-busy", String(loading));
    }

    // Build a <dt>/<dd> pair. textContent is used everywhere so rule text can't inject HTML.
    function addRow(dl, label, valueNode) {
      const dt = document.createElement("dt");
      dt.textContent = label;
      const dd = document.createElement("dd");
      dd.appendChild(valueNode);
      dl.append(dt, dd);
    }

    function sourceNode(url) {
      // Only make a link for real http(s) URLs; placeholders like "TODO-verify" stay as text.
      if (/^https?:\/\//i.test(url)) {
        const a = document.createElement("a");
        a.href = url;
        a.textContent = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        return a;
      }
      return document.createTextNode(url);
    }

    function showResult(data) {
      resultBox.replaceChildren();
      resultBox.className = data.status;
      resultBox.style.display = "block";

      const msg = document.createElement("p");
      msg.textContent = data.message;
      resultBox.appendChild(msg);

      if (data.status === "ok") {
        const dl = document.createElement("dl");
        addRow(dl, "Bin", document.createTextNode(data.bin));
        addRow(dl, "Prep step", document.createTextNode(data.prep_step));
        addRow(dl, "Source", sourceNode(data.source_url));
        addRow(dl, "Date checked", document.createTextNode(data.date_checked));
        resultBox.appendChild(dl);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const item = document.getElementById("item").value.trim();
      const context = document.getElementById("context").value;
      if (!item || askButton.disabled) return;

      setLoading(true);
      resultBox.style.display = "none";

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ item, context }),
        });
        if (!res.ok) throw new Error("Server returned " + res.status);
        showResult(await res.json());
      } catch (err) {
        showResult({ status: "error", message: "Something went wrong: " + err.message });
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
